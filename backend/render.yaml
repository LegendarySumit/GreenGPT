services:
  - type: web
    name: greengpt-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FIREBASE_PROJECT_ID
        scope: run
      - key: FIREBASE_SERVICE_ACCOUNT
        scope: run
      - key: GEMINI_API_KEY
        scope: run
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: FRONTEND_URL
        value: https://greengpt.vercel.app
