services:
  - type: web
    name: greengpt-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FIREBASE_PROJECT_ID
        scope: run
      - key: FIREBASE_SERVICE_ACCOUNT
        scope: run
      - key: GEMINI_API_KEY
        scope: run
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: CORS_ALLOWED_ORIGINS
        value: https://greengpt.vercel.app
      - key: DEV_CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
      - key: JSON_BODY_LIMIT
        value: 1mb
      - key: REQUEST_TIMEOUT_MS
        value: 120000
      - key: MAX_UPLOAD_BYTES
        value: 52428800
      - key: MAX_ANALYZE_FILE_BYTES
        value: 52428800
      - key: MAX_MESSAGE_LENGTH
        value: 4000
      - key: MAX_FILES_CONTEXT
        value: 5
      - key: MAX_FILE_NAME_LENGTH
        value: 200
      - key: MAX_FILE_CONTENT_LENGTH
        value: 12000
      - key: MAX_HISTORY_ITEMS
        value: 40
      - key: MAX_HISTORY_MESSAGE_LENGTH
        value: 4000
      - key: GLOBAL_RATE_WINDOW_MS
        value: 60000
      - key: GLOBAL_RATE_USER_MAX
        value: 160
      - key: GLOBAL_RATE_IP_MAX
        value: 300
      - key: CHAT_RATE_WINDOW_MS
        value: 60000
      - key: CHAT_RATE_USER_MAX
        value: 80
      - key: CHAT_RATE_IP_MAX
        value: 120
      - key: ANALYZE_RATE_WINDOW_MS
        value: 60000
      - key: ANALYZE_RATE_USER_MAX
        value: 20
      - key: ANALYZE_RATE_IP_MAX
        value: 40
      - key: UPSTASH_REDIS_REST_URL
        scope: run
      - key: UPSTASH_REDIS_REST_TOKEN
        scope: run
      - key: SENTRY_DSN
        scope: run
      - key: SENTRY_ENVIRONMENT
        value: production
