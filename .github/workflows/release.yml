name: Release & Versioning

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Generate changelog from commits since last release
          PREV_TAG=$(git tag -l | sort -V | tail -n 2 | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --format="- %h: %s")
          else
            COMMITS=$(git log $PREV_TAG..HEAD --oneline --format="- %h: %s")
          fi
          
          echo "### Changes in $VERSION" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "$COMMITS" >> CHANGELOG.md
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.changelog.outputs.version }}
          release_name: Release ${{ steps.changelog.outputs.version }}
          body: |
            ## 🚀 Changes
            ${{ steps.changelog.outputs.changelog }}

            ## 📝 Release Notes
            See [CHANGELOG.md](CHANGELOG.md) for full details.

            ---
            **Deployed to:**
            - Backend: https://greengpt-backend.onrender.com
            - Frontend: https://greengpt.vercel.app
          draft: false
          prerelease: false

      - name: Notify release
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `🎉 Version ${{ steps.changelog.outputs.version }} has been released!`
            })
        continue-on-error: true

  check-version:
    name: Validate Version Tags
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Validate semver
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          if [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+)?(\+[0-9A-Za-z-]+)?$ ]]; then
            echo "✅ Valid semantic version: $VERSION"
          else
            echo "❌ Invalid semantic version: $VERSION"
            echo "Expected format: v1.0.0, v1.0.0-alpha, v1.0.0+build"
            exit 1
          fi
