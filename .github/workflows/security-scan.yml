name: Security & Dependency Scanning

permissions:
  contents: read
  actions: read
  security-events: write

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1' # Weekly on Mondays

jobs:
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency Check on backend
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'GreenGPT-Backend'
          path: './backend'
          format: 'JSON'
          args: >
            --enableExperimental
      
      - name: Run OWASP Dependency Check on frontend
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'GreenGPT-Frontend'
          path: './frontend'
          format: 'JSON'
          args: >
            --enableExperimental

      - name: Upload OWASP results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-results
          path: reports/

  secret-scanning:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug

      - name: GITLEAKS secret scanning
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        continue-on-error: true
        with:
          category: "/language:${{ matrix.language }}"

  npm-audit-backend:
    name: npm audit - Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run npm audit
        working-directory: backend
        run: npm audit --audit-level=moderate --production
        continue-on-error: true

      - name: Generate audit report
        working-directory: backend
        run: npm audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report-backend
          path: backend/audit-report.json

  npm-audit-frontend:
    name: npm audit - Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=moderate --production
        continue-on-error: true

      - name: Generate audit report
        working-directory: frontend
        run: npm audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report-frontend
          path: frontend/audit-report.json

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Check backend licenses
        working-directory: backend
        run: |
          npm install -g license-report
          license-report --package ./package.json --markdown > BACKEND_LICENSES.md
          echo "Backend licenses checked"
        continue-on-error: true

      - name: Check frontend licenses
        working-directory: frontend
        run: |
          npm install -g license-report
          license-report --package ./package.json --markdown > FRONTEND_LICENSES.md
          echo "Frontend licenses checked"
        continue-on-error: true

      - name: Upload license reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-reports
          path: |
            backend/BACKEND_LICENSES.md
            frontend/FRONTEND_LICENSES.md
