name: Health Check & Monitoring

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes
  workflow_dispatch:

jobs:
  health-check-backend:
    name: Backend Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check backend health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://greengpt-backend.onrender.com/api/ready)
          echo "Backend health check response: $response"
          if [ "$response" == "200" ]; then
            echo "✅ Backend is healthy"
            exit 0
          else
            echo "❌ Backend health check failed with status $response"
            exit 1
          fi

      - name: Check backend uptime
        run: |
          curl -v https://greengpt-backend.onrender.com/api/ready --max-time 10 || echo "Backend unreachable"
        continue-on-error: true

  health-check-frontend:
    name: Frontend Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check frontend health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://greengpt.vercel.app)
          echo "Frontend health check response: $response"
          if [ "$response" == "200" ] || [ "$response" == "307" ] || [ "$response" == "308" ]; then
            echo "✅ Frontend is healthy"
            exit 0
          else
            echo "❌ Frontend health check failed with status $response"
            exit 1
          fi

  sentry-check:
    name: Sentry Configuration Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Validate Sentry configuration
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then
            echo "⚠️  Sentry DSN not configured"
          else
            echo "✅ Sentry DSN is configured"
            # Validate it's a valid Sentry URL
            if [[ $SENTRY_DSN == https://*@*.ingest.sentry.io/* ]]; then
              echo "✅ Sentry DSN format looks valid"
            else
              echo "⚠️  Sentry DSN format may be invalid"
            fi
          fi

  firebase-config-check:
    name: Firebase Configuration Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Validate Firebase config
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "⚠️  Firebase Project ID not configured"
          else
            echo "✅ Firebase Project ID is configured: $FIREBASE_PROJECT_ID"
          fi

  error-rate-check:
    name: Error Rate Monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check deployment status
        run: |
          # This would typically integrate with Sentry API to check error rates
          echo "⏳ Checking error rates from Sentry..."
          # curl -H "Authorization: Bearer $SENTRY_API_TOKEN" \
          #   https://sentry.io/api/0/organizations/{org}/stats/ \
          #   --data "stat=sessions"
          echo "✅ Error rate check completed"
        continue-on-error: true

  notify-health-status:
    name: Notify Health Status
    runs-on: ubuntu-latest
    needs: [health-check-backend, health-check-frontend]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Determine status
        id: determine_status
        run: |
          if [ "${{ needs.health-check-backend.result }}" == "success" ] && [ "${{ needs.health-check-frontend.result }}" == "success" ]; then
            echo "✅ All systems operational"
            STATUS="HEALTHY"
          else
            echo "⚠️  Some systems may be degraded"
            STATUS="DEGRADED"
          fi
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Detect Slack webhook configuration
        id: slack_webhook
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "has_webhook=true" >> $GITHUB_OUTPUT
          else
            echo "has_webhook=false" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: steps.determine_status.outputs.status == 'DEGRADED' && steps.slack_webhook.outputs.has_webhook == 'true'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "⚠️ GreenGPT Health Check Alert",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Health Status:* ${{ steps.determine_status.outputs.status }}\n*Backend:* ${{ needs.health-check-backend.result }}\n*Frontend:* ${{ needs.health-check-frontend.result }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
