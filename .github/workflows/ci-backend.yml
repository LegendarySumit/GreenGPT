name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  test:
    name: Production Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Validate backend dependencies
        working-directory: backend
        run: |
          echo "✅ Backend dependencies validated"
          npm ls --depth=0 || true

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: npm audit
        working-directory: backend
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for vulnerable dependencies
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          args: backend

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test, security]
    if: always()
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Verify server startup
        working-directory: backend
        run: timeout 10 npm start || true
        env:
          NODE_ENV: production
          PORT: 3000
          FIREBASE_PROJECT_ID: test-project
          GEMINI_API_KEY: test-key
          GEMINI_MODEL: gemini-2.5-flash

  deploy-preview:
    name: Deploy to Preview (Render)
    runs-on: ubuntu-latest
    needs: [test, build]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'
    environment:
      name: preview
      url: https://greengpt-preview.onrender.com

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_PREVIEW_DEPLOY_HOOK }}
        run: |
          DEPLOY_HOOK=$(printf '%s' "$RENDER_DEPLOY_HOOK" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -n "$DEPLOY_HOOK" ]; then
            if [[ "$DEPLOY_HOOK" != https://api.render.com/deploy/* ]]; then
              echo "Invalid RENDER_PREVIEW_DEPLOY_HOOK format"
              exit 1
            fi
            curl --fail --show-error --silent -X POST "$DEPLOY_HOOK"
            echo "Preview deployment triggered"
          else
            echo "RENDER_PREVIEW_DEPLOY_HOOK not configured, skipping"
          fi

      - name: Wait and verify health check
        run: |
          timeout 300 bash -c 'until curl -f http://localhost:5001/api/ready; do sleep 10; done' || echo "Health check timed out"
        continue-on-error: true

  deploy-production:
    name: Deploy to Production (Render)
    runs-on: ubuntu-latest
    needs: [test, build]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://greengpt-backend.onrender.com

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render production deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
        run: |
          DEPLOY_HOOK=$(printf '%s' "$RENDER_DEPLOY_HOOK" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -n "$DEPLOY_HOOK" ]; then
            if [[ "$DEPLOY_HOOK" != https://api.render.com/deploy/* ]]; then
              echo "Invalid RENDER_PRODUCTION_DEPLOY_HOOK format"
              exit 1
            fi
            curl --fail --show-error --silent -X POST "$DEPLOY_HOOK"
            echo "Production deployment triggered"
          else
            echo "RENDER_PRODUCTION_DEPLOY_HOOK not configured, skipping"
          fi

      - name: Notify deployment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Backend deployed to production successfully!'
            })
        continue-on-error: true
